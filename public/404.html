<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TeacherTime</title>
    <!--
      GitHub Pages serves static files only: it has no idea /clock is a route
      inside the app, so reloading that URL (or the browser's refresh button on
      the clock page) lands here instead of on index.html. A reload has no
      resolved start time to run from anyway, so send the teacher to Settings
      to press Submit again — the same thing App does for /clock in dev.
    -->
    <script>
      location.replace(location.origin + "/");
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
  </head>
  <body></body>
</html>
